# docker-compose.yml (sem a linha version)
services:
  postgres:
    image: postgres:15
    container_name: auth_postgres  # ← Nome fixo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth_network

  redis:
    image: redis:7-alpine
    container_name: auth_redis  # ← Nome fixo
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - auth_network
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  auth_network:
    driver: bridge